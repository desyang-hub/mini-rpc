name: CMake on a single platform

on:
  push:
    branches: [ "dev",  "refactor/v3.1"]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # ==================== 缓存依赖 ====================
    - name: Cache CMake dependencies (_deps only)
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/build/_deps
        key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt') }}

    # --- 安装系统依赖 ---
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcurl4-openssl-dev \
          protobuf-compiler \
          libprotobuf-dev \
          libprotoc-dev \
          libboost-dev \
          cmake \
          g++ \
          make

    # --- 配置 CMake ---
    # GTest 通过 FetchContent 自动获取，无需安装 libgtest-dev
    - name: Configure CMake
      run: cmake -B ${{ github.workspace }}/build -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    # ==================== 构建 ====================
    - name: Build
      run: |
        set -eo pipefail
        cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} -j$(nproc) 2>&1 | tee build.log || {
          echo "================ BUILD FAILED ================="
          echo "Extracting actual errors from full log:"
          grep -iE "(error:|fatal error:|undefined reference|multiple definition|FAILED:)" build.log || true
          echo "==============================================="
          exit 1
        }

    # ==================== 测试 ====================
    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure
